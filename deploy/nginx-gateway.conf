# 部署于 192.168.3.65，8801 接收 HTTPS 穿透入口转来的 HTTP 请求。
map $http_upgrade $fieldwar_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8801;
    listen [::]:8801;
    server_name game.hidewnd.cn;
    # 外层已终止 TLS，重定向使用相对地址，避免泄露内网协议和端口。
    absolute_redirect off;

    location = /fieldwar {
        return 308 /fieldwar/$is_args$args;
    }
    location = /fieldwar/admin/ {
        return 308 /fieldwar/admin$is_args$args;
    }
    location /fieldwar/ {
        proxy_pass http://192.168.3.61:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fieldwar_connection_upgrade;
        # 同域名可能承载其他游戏，账号 Cookie 只发送至此游戏子路径。
        proxy_cookie_path / /fieldwar/;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location / {
        return 404;
    }
}
